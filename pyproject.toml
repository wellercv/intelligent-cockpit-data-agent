[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "business-data-insight-agent"
version = "0.1.0"
description = "Agent-based analysis and governance for intelligent cockpit multilingual voice quality data"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wellercv"}]
keywords = ["llm-agent", "langgraph", "rag", "data-governance", "asr", "nlu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "azure-identity>=1.19,<2",
    "chromadb>=1.5,<2",
    "duckdb>=1.3,<2",
    "fastapi>=0.115,<1",
    "gitpython>=3.1.55,<4",
    "langgraph>=0.3,<2",
    "mcp>=1.28,<2",
    "openpyxl>=3.1,<4",
    "openai>=1.40,<3",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6,<7",
    "streamlit>=1.40,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.14,<3",
    "pip-audit>=2.9,<3",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]
docs = ["python-docx>=1.1,<2"]

[project.scripts]
data-agent = "data_insight.cli:main"

[project.urls]
Homepage = "https://github.com/wellercv/intelligent-cockpit-data-agent"
Repository = "https://github.com/wellercv/intelligent-cockpit-data-agent"
Issues = "https://github.com/wellercv/intelligent-cockpit-data-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "requires_business_data: requires the private 92,301-case source dataset",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = [
    "src/data_insight/schemas.py",
    "src/data_insight/safety.py",
    "src/data_insight/grounding.py",
    "src/data_insight/export.py",
    "src/data_insight/tool_runtime.py",
    "src/data_insight/demo_data.py",
    "src/data_insight/nlu_warehouse.py",
    "src/data_insight/providers/nlu.py",
]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

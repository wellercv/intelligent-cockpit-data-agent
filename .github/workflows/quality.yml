name: Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-without-business-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_AGENT_DATA_ROOT: ${{ runner.temp }}/data-agent-ci-empty

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Prepare empty data boundary
        run: mkdir -p "$DATA_AGENT_DATA_ROOT"

      - name: Static quality gate
        run: python -m ruff check src app.py tests

      - name: Typed core contracts
        run: python -m mypy

      - name: Data-independent tests
        run: python -m pytest -m "not requires_business_data"

      - name: Dependency consistency
        run: python -m pip check

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag data-insight-agent:ci .
name: Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-without-business-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_AGENT_DATA_ROOT: /tmp/data-agent-ci-empty

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Prepare empty data boundary
        run: mkdir -p "$DATA_AGENT_DATA_ROOT"

      - name: Static quality gate
        run: python -m ruff check src app.py tests

      - name: Typed core contracts
        run: python -m mypy

      - name: Data-independent tests
        run: python -m pytest -m "not requires_business_data"

      - name: Dependency consistency
        run: python -m pip check

      - name: Dependency vulnerability audit
        run: >-
          python -m pip_audit --skip-editable
          --ignore-vuln PYSEC-2026-311

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: docker build --tag data-insight-agent:ci .

      - name: Start synthetic demo container
        run: >-
          docker run --detach --name data-agent-ci
          --publish 8000:8000 data-insight-agent:ci

      - name: Smoke test demo health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > health.json; then
              break
            fi
            sleep 2
          done
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("health.json").read_text())
          providers = {
              item["provider"]: item
              for item in payload["provider"]["providers"]
          }
          assert payload["status"] == "ok"
          assert providers["multilingual_asr"]["synthetic_demo"] is True
          assert providers["multilingual_asr"]["cases"] == 42
          assert providers["nlu_evaluation"]["synthetic_demo"] is True
          assert providers["nlu_evaluation"]["samples"] == 14
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker logs data-agent-ci

      - name: Stop demo container
        if: always()
        run: docker rm --force data-agent-ci || true